# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── CognoDB connection via Neo4j Java Driver (Bolt protocol) ───────────────────
# Set these via environment variables — never hardcode credentials here.
# Obtain values from: CognoDB Cloud dashboard → your instance → "Connect"
cognodb.uri=${COGNODB_URI}
cognodb.username=${COGNODB_USERNAME:cognodb}
cognodb.password=${COGNODB_PASSWORD}

# ── CORS ───────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.skillgraph=INFO
logging.level.org.neo4j.driver=WARN
logging.level.org.springframework.web=INFO

# ── Spring ─────────────────────────────────────────────────────────────────────
spring.application.name=SkillGraph
spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=false
